name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: API et moteur Python
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/script
      SESSION_DB_PATH: /tmp/sessions.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Compilation
        run: python -m compileall -q api script/game script/game_tree
      - name: Démarrage de l'API
        run: python -c "import api.app"
      - name: Leçons
        run: python script/test_lessons.py
      - name: Minimax
        run: python script/test_optimized_minimax.py
      - name: MCTS
        run: python script/test_mcts_advisor.py
      - name: Tablebase
        run: python script/test_tablebase.py
      - name: Puzzles
        run: python scripts/check_puzzle_pack.py
      - name: Échelle des bots
        run: python scripts/check_bot_arena.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 4mation_dashboard_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 4mation_dashboard_dev/package-lock.json
      - run: npm ci
      - run: npm run check:diagrams
      - run: npm run build
